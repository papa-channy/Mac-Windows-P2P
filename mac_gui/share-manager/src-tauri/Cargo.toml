[package]
name = "share-manager"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "share_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
uuid = { version = "1", features = ["v4"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", default-features = false, features = ["apple-native"] }
ureq = { version = "2", features = ["json"] }
# PAT 셰어 동기화 — ed25519 SSH 키 (이미 양쪽 호스트가 보유) 를 recipient
# / identity 로 활용해서 PAT 를 셰어 통과 전달. cross-OS 동등 (Win 측도
# 같은 crate + 같은 wire format).
age = { version = "0.10", features = ["ssh"] }
# mDNS browse — discover direct-link SMB hosts on the local subnet so
# the user doesn't have to manually type the Windows IP after every
# network change. Pure-Rust, cross-platform (works on the Win side too
# when the contract gets backported).
mdns-sd = "0.13"
# parallel git scan + remote fetch — without it the 98-repo case is
# ~30s of sequential `git -C` shell-outs; rayon brings it down to
# ~4-6s on an 8-core mac (IO-bound work, plenty of headroom).
rayon = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow"] }
objc2-foundation = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
